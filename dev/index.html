<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D Sandal Configurator — Dev Preview</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #fafafa;
        color: #1f1f1f;
      }
      .wrap { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1.25rem; }
      h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
      .note { font-size: 0.85rem; opacity: 0.6; margin: 0 0 1.5rem; }
      /* Finto stile ".button" del tema, solo per l'anteprima locale (non spedito su Shopify) */
      .button { display:inline-block; padding:1rem 2.2rem; border:1px solid #1f1f1f; border-radius:6px;
                background:#1f1f1f; color:#fff; font:inherit; font-size:1.05rem; cursor:pointer; }
      .button:hover { opacity:0.9; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>3D Sandal Configurator — Dev Preview</h1>
      <p class="note">
        Placeholder geometry if <code>public/models/sandal.glb</code> doesn't exist,
        otherwise your real model. Add-to-cart is simulated (see the browser console).
      </p>

      <div class="sandal-configurator-embed">
        <button type="button" class="button button--primary" data-sc-open aria-haspopup="dialog">
          Configure your sandal
        </button>
        <p class="sc-launcher-sub">Choose colors and upper in 3D</p>

        <div class="sc-modal" data-sc-modal hidden role="dialog" aria-modal="true" aria-label="Configure your sandal">
          <button type="button" class="sc-modal-close" data-sc-close aria-label="Close">&times;</button>
          <!-- data-model-url: metti sandal.glb in public/models/ (vedi public/models/README.md).
               Se il file non c'è, il loader ricade da solo sul segnaposto: nessun errore. -->
          <div class="sandal-configurator" data-model-url="/models/sandal.glb">
            <div data-sc-canvas></div>
            <div data-sc-panel></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
